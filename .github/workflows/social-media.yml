name: Fazl Ullah Azaad - Daily Social Media Automation

on:
  schedule:
    # 08:00 AM Pakistan Standard Time (UTC+5)
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. GENERATE POST + IMAGE
      # ============================================================

      - name: Generate daily content and image
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PYTHON'
          import os
          import json
          import base64
          import time
          import requests
          from pathlib import Path

          OPENROUTER_API_KEY = os.environ["OPENROUTER_API_KEY"]

          BASE_URL = "https://openrouter.ai/api/v1"

          headers = {
              "Authorization": f"Bearer {OPENROUTER_API_KEY}",
              "Content-Type": "application/json",
              "HTTP-Referer": "https://github.com/",
              "X-Title": "Fazl Ullah Azaad Daily Social Media Automation",
          }

          # ------------------------------------------------------------
          # TEXT MODEL
          # ------------------------------------------------------------
          #
          # OpenRouter's free router automatically selects an available
          # free model.
          #
          TEXT_MODEL = "openrouter/free"

          prompt = r"""
          Create ONE completely original social-media post for the
          personal brand of Fazl Ullah Azaad.

          IMPORTANT:
          This is for Fazl Ullah Azaad's PERSONAL BRAND.
          It is NOT an AELAMA advertisement.

          The post must be:

          - Original
          - Intelligent
          - Meaningful
          - Realistic
          - Emotionally mature
          - Motivational without being childish
          - Suitable for Facebook, Instagram and LinkedIn
          - Based on real human experiences
          - Useful and thought-provoking
          - Professional but natural
          - Written in clear, powerful English

          Possible themes include:

          - Personal growth
          - Discipline
          - Consistency
          - Resilience
          - Self-respect
          - Learning
          - Career growth
          - Leadership
          - Failure and recovery
          - Patience
          - Responsibility
          - Hard work
          - Building yourself
          - Overcoming difficulties
          - Realistic success
          - Human behavior
          - Life lessons

          Avoid:

          - Generic motivational clichés
          - Fake quotations
          - Quotes attributed to famous people
          - Invented statistics
          - Unsupported factual claims
          - Excessive emojis
          - Overly dramatic language
          - Fake success stories
          - AELAMA promotion
          - Political persuasion
          - Religious preaching unless directly relevant
          - Repeating the same idea in different words

          The post should feel like something a thoughtful,
          experienced person would genuinely publish.

          Create EXACTLY these JSON fields:

          {
            "caption": "...",
            "description": "...",
            "seo_keywords": ["...", "..."],
            "facebook_instagram_hashtags": ["...", "..."],
            "linkedin_hashtags": ["...", "..."],
            "image_prompt": "..."
          }

          Requirements:

          caption:
          A short powerful opening line or headline.

          description:
          The complete social-media post.

          seo_keywords:
          8-12 relevant search-friendly keywords.

          facebook_instagram_hashtags:
          8-12 natural hashtags.

          linkedin_hashtags:
          4-8 professional hashtags.

          image_prompt:
          A detailed prompt for a photorealistic cinematic image
          representing the meaning of the post.

          Image requirements:

          - Photorealistic
          - Cinematic
          - Professional
          - Realistic human environment
          - Natural lighting
          - Vertical 9:16 composition
          - Strong visual storytelling
          - No text
          - No words
          - No letters
          - No logos
          - No watermark
          - No captions inside the image

          Return ONLY valid JSON.
          """

          def call_openrouter(payload, retries=4):
              last_error = None

              for attempt in range(retries):
                  try:
                      response = requests.post(
                          f"{BASE_URL}/chat/completions",
                          headers=headers,
                          json=payload,
                          timeout=120
                      )

                      if response.status_code == 200:
                          return response.json()

                      last_error = (
                          f"HTTP {response.status_code}: "
                          f"{response.text[:1000]}"
                      )

                      # Retry temporary errors
                      if response.status_code in (408, 429, 500, 502, 503, 504):
                          time.sleep(2 ** attempt)
                          continue

                      raise RuntimeError(last_error)

                  except requests.RequestException as e:
                      last_error = str(e)

                      if attempt < retries - 1:
                          time.sleep(2 ** attempt)
                          continue

                      raise

              raise RuntimeError(
                  f"OpenRouter failed after {retries} attempts: {last_error}"
              )

          # ------------------------------------------------------------
          # GENERATE TEXT
          # ------------------------------------------------------------

          print("Generating today's social-media post...")

          payload = {
              "model": TEXT_MODEL,
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.9,
              "max_tokens": 2500
          }

          result = call_openrouter(payload)

          content = result["choices"][0]["message"]["content"]

          # Remove accidental markdown fences
          content = content.strip()

          if content.startswith("```"):
              content = content.replace("```json", "", 1)
              content = content.replace("```", "", 1)
              content = content.strip()

          try:
              post = json.loads(content)
          except json.JSONDecodeError:
              print("Model returned:")
              print(content)
              raise RuntimeError("OpenRouter did not return valid JSON.")

          required_fields = [
              "caption",
              "description",
              "seo_keywords",
              "facebook_instagram_hashtags",
              "linkedin_hashtags",
              "image_prompt"
          ]

          for field in required_fields:
              if field not in post:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

          # ------------------------------------------------------------
          # GENERATE IMAGE THROUGH OPENROUTER
          # ------------------------------------------------------------

          print("Generating today's image through OpenRouter...")

          image_payload = {
              # Low-cost image model.
              # Change this model later if you want another one.
              "model": "bytedance-seed/seedream-4.5",

              "prompt": post["image_prompt"],

              "aspect_ratio": "9:16",

              "n": 1
          }

          image_response = requests.post(
              f"{BASE_URL}/images",
              headers=headers,
              json=image_payload,
              timeout=180
          )

          if image_response.status_code != 200:
              raise RuntimeError(
                  "OpenRouter image generation failed: "
                  f"HTTP {image_response.status_code}: "
                  f"{image_response.text[:2000]}"
              )

          image_data = image_response.json()

          if not image_data.get("data"):
              raise RuntimeError(
                  "OpenRouter returned no image data."
              )

          encoded_image = image_data["data"][0].get("b64_json")

          if not encoded_image:
              raise RuntimeError(
                  "OpenRouter image response did not contain b64_json."
              )

          image_bytes = base64.b64decode(encoded_image)

          Path("generated_images").mkdir(
              parents=True,
              exist_ok=True
          )

          image_path = Path(
              "generated_images/daily_image.jpg"
          )

          image_path.write_bytes(image_bytes)

          # ------------------------------------------------------------
          # SAVE POST DATA
          # ------------------------------------------------------------

          post["image_file"] = str(image_path)

          with open("post_data.json", "w", encoding="utf-8") as f:
              json.dump(
                  post,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("========================================")
          print("TODAY'S GENERATED CONTENT")
          print("========================================")
          print(json.dumps(
              post,
              ensure_ascii=False,
              indent=2
          ))
          print("========================================")

          print(
              f"Image saved to: {image_path}"
          )

          PYTHON

      # ============================================================
      # 3. DISPLAY GENERATED CONTENT
      # ============================================================

      - name: Show generated post
        run: |
          echo "=============================="
          echo "GENERATED POST"
          echo "=============================="
          cat post_data.json

      # ============================================================
      # 4. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: daily-social-media-content
          path: |
            post_data.json
            generated_images/
          retention-days: 7

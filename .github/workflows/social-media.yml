name: Fazl Ullah Azaad - Gemini Social Media Automation

on:
  schedule:
    # 08:00 AM Pakistan Standard Time = 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      image_count:
        description: "Number of images to generate (1-4)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IMAGE_COUNT: ${{ github.event.inputs.image_count || '1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate content and images
        run: |
          python3 <<'PYTHON'
          import os
          import json
          import base64
          import time
          import random
          import urllib.request
          import urllib.error
          from pathlib import Path


          # ========================================
          # CONFIGURATION
          # ========================================

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"].strip()

          if not GEMINI_API_KEY:
              raise RuntimeError("GEMINI_API_KEY is empty.")

          image_count = int(os.environ.get("IMAGE_COUNT", "1"))
          image_count = max(1, min(4, image_count))

          MAX_RETRIES = 6
          BASE_DELAY = 2
          REQUEST_TIMEOUT = 180


          # ========================================
          # GEMINI REQUEST WITH INTELLIGENT RETRIES
          # ========================================

          def gemini_request(model, payload):

              url = (
                  "https://generativelanguage.googleapis.com/"
                  f"v1/models/{model}:generateContent"
              )

              retryable_codes = {
                  408,
                  429,
                  500,
                  502,
                  503,
                  504
              }

              last_error = None

              for attempt in range(MAX_RETRIES):

                  request = urllib.request.Request(
                      url,
                      data=json.dumps(
                          payload
                      ).encode("utf-8"),
                      headers={
                          "x-goog-api-key": GEMINI_API_KEY,
                          "Content-Type": "application/json"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=REQUEST_TIMEOUT
                      ) as response:

                          result = json.loads(
                              response.read().decode(
                                  "utf-8"
                              )
                          )

                          return result


                  except urllib.error.HTTPError as error:

                      body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      last_error = (
                          f"HTTP {error.code}: {body}"
                      )

                      if error.code not in retryable_codes:

                          raise RuntimeError(
                              f"Gemini request failed: "
                              f"{last_error}"
                          )

                      if attempt == MAX_RETRIES - 1:

                          break


                      # Exponential backoff:
                      # 2, 4, 8, 16, 32...
                      delay = (
                          BASE_DELAY *
                          (2 ** attempt)
                      )

                      # Add random jitter
                      delay += random.uniform(
                          0,
                          2
                      )

                      print(
                          f"Gemini temporarily unavailable "
                          f"({error.code})."
                      )

                      print(
                          f"Retrying in {delay:.1f} "
                          f"seconds..."
                      )

                      time.sleep(delay)


                  except (
                      urllib.error.URLError,
                      TimeoutError
                  ) as error:

                      last_error = str(error)

                      if attempt == MAX_RETRIES - 1:

                          break

                      delay = (
                          BASE_DELAY *
                          (2 ** attempt)
                      )

                      delay += random.uniform(
                          0,
                          2
                      )

                      print(
                          "Temporary network error."
                      )

                      print(
                          f"Retrying in {delay:.1f} "
                          f"seconds..."
                      )

                      time.sleep(delay)


              raise RuntimeError(
                  f"Gemini request failed after "
                  f"{MAX_RETRIES} attempts. "
                  f"Last error: {last_error}"
              )


          # ========================================
          # EXTRACT TEXT
          # ========================================

          def extract_text(response):

              candidates = response.get(
                  "candidates",
                  []
              )

              if not candidates:

                  raise RuntimeError(
                      "No Gemini candidates returned: "
                      f"{response}"
                  )

              parts = (
                  candidates[0]
                  .get("content", {})
                  .get("parts", [])
              )

              text_parts = []

              for part in parts:

                  if part.get("text"):

                      text_parts.append(
                          part["text"]
                      )

              if not text_parts:

                  raise RuntimeError(
                      "No text found in Gemini response: "
                      f"{response}"
                  )

              return "\n".join(
                  text_parts
              )


          # ========================================
          # START CONTENT GENERATION
          # ========================================

          print("")
          print("========================================")
          print("GENERATING SOCIAL MEDIA CONTENT")
          print("========================================")
          print("")

          content_prompt = f"""
          Create ONE completely original, realistic,
          intelligent, meaningful and powerful
          social-media post for the personal brand of
          Fazl Ullah Azaad.

          This content is NOT for AELAMA.

          The topic should naturally relate to real life.
          Possible themes include:

          - personal growth
          - resilience
          - discipline
          - consistency
          - self-respect
          - overcoming difficulties
          - career development
          - learning
          - leadership
          - realistic success
          - meaningful human experiences

          Requirements:

          - Completely original content.
          - Do not invent quotations.
          - Do not attribute quotes to famous people.
          - Do not make unsupported factual claims.
          - Avoid generic motivational clichés.
          - Make the writing realistic and emotionally intelligent.
          - Make it meaningful and thought-provoking.
          - Suitable for Facebook, Instagram and LinkedIn.
          - Write one strong caption.
          - Write one engaging description.
          - Provide relevant SEO keywords.
          - Provide natural Facebook and Instagram hashtags.
          - Provide professional LinkedIn hashtags.
          - Create exactly {image_count} different image prompts.
          - Every image prompt must visually match the post.
          - Images should be photorealistic and cinematic.
          - Images should be professional and visually powerful.
          - Absolutely no text, words, letters, logos
            or watermarks inside the images.
          - Images should use vertical 9:16 composition.

          Return ONLY valid JSON.

          Use exactly this structure:

          {{
            "caption": "string",
            "description": "string",
            "seo_keywords": [
              "keyword"
            ],
            "facebook_instagram_hashtags": [
              "#hashtag"
            ],
            "linkedin_hashtags": [
              "#hashtag"
            ],
            "image_prompts": [
              "detailed image prompt"
            ]
          }}
          """


          content_payload = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": content_prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "responseMimeType": "application/json",
                  "temperature": 0.8,
                  "maxOutputTokens": 4000
              }
          }


          content_response = gemini_request(
              "gemini-3.8-flash",
              content_payload
          )

          print("Gemini content response received.")

          raw_content = extract_text(
              content_response
          )


          # ========================================
          # PARSE JSON
          # ========================================

          try:

              generated = json.loads(
                  raw_content
              )

          except json.JSONDecodeError as error:

              raise RuntimeError(
                  "Gemini returned invalid JSON.\n\n"
                  f"Response:\n{raw_content}\n\n"
                  f"Error: {error}"
              )


          required_fields = [
              "caption",
              "description",
              "seo_keywords",
              "facebook_instagram_hashtags",
              "linkedin_hashtags",
              "image_prompts"
          ]

          missing = [
              field
              for field in required_fields
              if not generated.get(field)
          ]

          if missing:

              raise RuntimeError(
                  f"Missing required fields: "
                  f"{missing}"
              )


          image_prompts = (
              generated["image_prompts"]
              [:image_count]
          )

          if len(image_prompts) < image_count:

              raise RuntimeError(
                  "Not enough image prompts "
                  "were generated."
              )

          print(
              "Content generated successfully."
          )


          # ========================================
          # IMAGE GENERATION
          # ========================================

          print("")
          print("========================================")
          print("GENERATING IMAGES")
          print("========================================")
          print("")

          output_dir = Path(
              "generated_images"
          )

          output_dir.mkdir(
              exist_ok=True
          )

          image_files = []


          for index, image_prompt in enumerate(
              image_prompts,
              start=1
          ):

              print(
                  f"Generating image "
                  f"{index}/{image_count}..."
              )


              final_prompt = f"""
              {image_prompt}

              Create a photorealistic,
              cinematic and visually powerful
              professional social-media image.

              Vertical 9:16 composition.

              Absolutely NO text.
              NO words.
              NO letters.
              NO typography.
              NO logos.
              NO watermarks.
              """


              image_payload = {
                  "contents": [
                      {
                          "role": "user",
                          "parts": [
                              {
                                  "text":
                                  final_prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "responseModalities": [
                          "TEXT",
                          "IMAGE"
                      ]
                  }
              }


              image_response = gemini_request(
                  "gemini-3.1-flash-image",
                  image_payload
              )


              candidates = (
                  image_response.get(
                      "candidates",
                      []
                  )
              )

              if not candidates:

                  raise RuntimeError(
                      f"No image candidate "
                      f"returned for image "
                      f"{index}: "
                      f"{image_response}"
                  )


              parts = (
                  candidates[0]
                  .get("content", {})
                  .get("parts", [])
              )

              image_data = None
              mime_type = "image/png"


              for part in parts:

                  inline_data = (
                      part.get("inlineData")
                      or part.get(
                          "inline_data"
                      )
                  )

                  if inline_data:

                      image_data = (
                          inline_data.get(
                              "data"
                          )
                      )

                      mime_type = (
                          inline_data.get(
                              "mimeType",
                              inline_data.get(
                                  "mime_type",
                                  "image/png"
                              )
                          )
                      )

                      if image_data:

                          break


              if not image_data:

                  raise RuntimeError(
                      f"No image data returned "
                      f"for image {index}: "
                      f"{image_response}"
                  )


              extension = "png"

              if "jpeg" in mime_type.lower():

                  extension = "jpg"

              elif "webp" in mime_type.lower():

                  extension = "webp"


              image_path = (
                  output_dir /
                  f"image_{index}.{extension}"
              )


              with open(
                  image_path,
                  "wb"
              ) as file:

                  file.write(
                      base64.b64decode(
                          image_data
                      )
                  )


              image_files.append(
                  str(image_path)
              )

              print(
                  f"Image {index} completed."
              )


          print("")
          print(
              "All images generated successfully."
          )


          # ========================================
          # CREATE FINAL SOCIAL MEDIA TEXT
          # ========================================

          seo_keywords = ", ".join(
              generated["seo_keywords"]
          )


          facebook_instagram_text = (
              f"{generated['caption']}\n\n"
              f"{generated['description']}\n\n"
              f"{' '.join(generated['facebook_instagram_hashtags'])}"
          )


          linkedin_text = (
              f"{generated['caption']}\n\n"
              f"{generated['description']}\n\n"
              f"{' '.join(generated['linkedin_hashtags'])}"
          )


          # ========================================
          # SAVE EVERYTHING
          # ========================================

          final_output = {

              "brand":
                  "Fazl Ullah Azaad",

              "caption":
                  generated["caption"],

              "description":
                  generated["description"],

              "seo_keywords":
                  generated["seo_keywords"],

              "facebook_instagram_hashtags":
                  generated[
                      "facebook_instagram_hashtags"
                  ],

              "linkedin_hashtags":
                  generated[
                      "linkedin_hashtags"
                  ],

              "image_prompts":
                  image_prompts,

              "facebook_instagram_text":
                  facebook_instagram_text,

              "linkedin_text":
                  linkedin_text,

              "image_files":
                  image_files
          }


          with open(
              "post_data.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  final_output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ========================================
          # SHOW RESULT
          # ========================================

          print("")
          print("========================================")
          print("SOCIAL MEDIA CONTENT GENERATED")
          print("========================================")
          print("")

          print("CAPTION:")
          print(
              generated["caption"]
          )

          print("")
          print("DESCRIPTION:")
          print(
              generated["description"]
          )

          print("")
          print("SEO KEYWORDS:")
          print(seo_keywords)

          print("")
          print(
              "FACEBOOK / INSTAGRAM HASHTAGS:"
          )

          print(
              " ".join(
                  generated[
                      "facebook_instagram_hashtags"
                  ]
              )
          )

          print("")
          print("LINKEDIN HASHTAGS:")

          print(
              " ".join(
                  generated[
                      "linkedin_hashtags"
                  ]
              )
          )

          print("")
          print("GENERATED IMAGES:")

          for image in image_files:

              print(image)

          print("")
          print("SUCCESS!")
          PYTHON

      - name: Show generated post data
        run: |
          cat post_data.json

      - name: Upload post and images
        uses: actions/upload-artifact@v4
        with:
          name: daily-social-media-content
          path: |
            post_data.json
            generated_images/
          retention-days: 7

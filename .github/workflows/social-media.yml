name: AELAMA Daily Social Media Automation

on:
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Generate motivational content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/zai-org/glm-4.7-flash" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "messages": [
                {
                  "role": "system",
                  "content": "You are AELAMA social media content strategist. Return ONLY valid JSON. Do not include reasoning, analysis, markdown, or code fences."
                },
                {
                  "role": "user",
                  "content": "Create one original, powerful, realistic and meaningful motivational social media post about real life. Avoid fake quotes, clichés and unsupported claims. Return exactly this JSON structure: {\"caption\":\"...\",\"description\":\"...\",\"seo_keywords\":[\"...\"],\"hashtags\":[\"...\"],\"image_prompt\":\"...\"}. The image_prompt must describe a powerful, realistic, professional vertical social media image with absolutely no text, letters, logos, or words."
                }
              ]
            }')

          echo "AI response received."

          echo "$RESPONSE" | python3 -c '
          import json
          import sys

          response = json.load(sys.stdin)

          try:
              content = response["result"]["choices"][0]["message"]["content"]
              post = json.loads(content)

              print("")
              print("==========================================")
              print("AELAMA DAILY SOCIAL MEDIA POST")
              print("==========================================")
              print("")
              print("CAPTION:")
              print(post["caption"])
              print("")
              print("DESCRIPTION:")
              print(post["description"])
              print("")
              print("SEO KEYWORDS:")
              print(", ".join(post["seo_keywords"]))
              print("")
              print("HASHTAGS:")
              print(" ".join(post["hashtags"]))
              print("")
              print("IMAGE PROMPT:")
              print(post["image_prompt"])
              print("")
              print("==========================================")

          except Exception as e:
              print("Error parsing generated content:", e)
              print(json.dumps(response, indent=2))
              sys.exit(1)
          '

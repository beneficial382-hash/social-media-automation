name: Test Gemini 3.8 Flash API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "ERROR: GEMINI_API_KEY is not configured."
            exit 1
          fi

          echo "Calling Gemini 3.8 Flash..."

          RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/interactions" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gemini-3.8-flash",
              "input": "Write one short, original, realistic and powerful motivational message about real life. Return only the message."
            }')

          echo ""
          echo "========== GEMINI RESPONSE =========="
          echo "$RESPONSE"
          echo "====================================="

          echo "$RESPONSE" | python3 -c '
          import json
          import sys

          response = json.load(sys.stdin)

          if response.get("error"):
              print("Gemini returned an error:")
              print(json.dumps(response["error"], indent=2))
              sys.exit(1)

          text = None

          for step in response.get("steps", []):
              for content in step.get("content", []):
                  if content.get("type") == "text":
                      text = content.get("text")
                      if text:
                          break
              if text:
                  break

          if not text:
              print("ERROR: No text was returned.")
              print(json.dumps(response, indent=2))
              sys.exit(1)

          print("")
          print("========== GENERATED MESSAGE ==========")
          print(text)
          print("========================================")
          print("")
          print("SUCCESS: Gemini 3.8 Flash API is working.")
          '

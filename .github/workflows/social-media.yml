name: Fazl Ullah Azaad - Daily Social Media Automation

on:
  schedule:
    # 08:00 AM Pakistan Standard Time = 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      image_count:
        description: "Number of images to generate (1-4)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}

      LINKEDIN_CHANNEL_ID: "6a9a260e065799be4684d272"
      INSTAGRAM_CHANNEL_ID: "6a9a25d6065799be4684d1d9"
      FACEBOOK_CHANNEL_ID: "6a9a21de065799be4684c649"

      IMAGE_COUNT: ${{ github.event.inputs.image_count || '1' }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate content and images
        run: |
          python3 <<'PYTHON'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          from pathlib import Path

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          api_token = os.environ["CLOUDFLARE_API_TOKEN"]

          image_count = int(os.environ.get("IMAGE_COUNT", "1"))
          image_count = max(1, min(4, image_count))


          def cloudflare_request(model, payload):

              url = (
                  f"https://api.cloudflare.com/client/v4/accounts/"
                  f"{account_id}/ai/run/{model}"
              )

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_token}",
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      result = json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as error:

                  body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"Cloudflare HTTP error {error.code}: {body}"
                  )

              if not result.get("success"):
                  raise RuntimeError(
                      f"Cloudflare request failed: {result}"
                  )

              return result.get("result", result)


          print("Generating original social media content...")


          schema = {
              "type": "object",

              "properties": {

                  "caption": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "seo_keywords": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },

                  "facebook_instagram_hashtags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },

                  "linkedin_hashtags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },

                  "image_prompts": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  }
              },

              "required": [
                  "caption",
                  "description",
                  "seo_keywords",
                  "facebook_instagram_hashtags",
                  "linkedin_hashtags",
                  "image_prompts"
              ]
          }


          prompt = f"""
          Create ONE completely original, powerful, realistic,
          intelligent and meaningful social-media post for the
          personal brand of Fazl Ullah Azaad.

          This is NOT content for AELAMA.

          The topic should relate to real life and may focus on:
          personal growth, resilience, discipline, consistency,
          self-respect, overcoming difficulties, career growth,
          learning, leadership, realistic success or meaningful
          human experiences.

          Requirements:

          - Completely original content.
          - Do not invent quotations.
          - Do not attribute quotes to famous people.
          - Do not make unsupported factual claims.
          - Avoid generic motivational clichés.
          - Make the writing realistic and emotionally intelligent.
          - Make it meaningful and thought-provoking.
          - Suitable for Facebook, Instagram and LinkedIn.
          - Write one strong caption.
          - Write one engaging description.
          - Provide relevant SEO keywords.
          - Provide natural hashtags for Facebook and Instagram.
          - Provide professional hashtags for LinkedIn.
          - Create exactly {image_count} different image prompts.
          - Each image must visually match the post.
          - Images should be photorealistic and cinematic.
          - Images should be professional and visually powerful.
          - Absolutely no text, words, letters, logos or watermarks
            inside the generated images.
          - Images should be suitable for vertical social media.

          Return only the requested structured data.
          """


          content_payload = {

              "messages": [

                  {
                      "role": "system",
                      "content": (
                          "You are an expert personal-brand social-media "
                          "content strategist. Create original, authentic "
                          "and structured content."
                      )
                  },

                  {
                      "role": "user",
                      "content": prompt
                  }
              ],

              "response_format": {
                  "type": "json_schema",
                  "json_schema": schema
              },

              "max_tokens": 2000
          }


          content_result = cloudflare_request(
              "@cf/meta/llama-3.3-70b-instruct-fp8-fast",
              content_payload
          )


          print("Cloudflare content response received.")


          generated = (
              content_result.get("response")
              or content_result.get("output")
              or content_result.get("content")
              or content_result
          )


          if isinstance(generated, str):
              generated = json.loads(generated)


          if not isinstance(generated, dict):

              raise RuntimeError(
                  f"Could not parse generated content: {content_result}"
              )


          required_fields = [
              "caption",
              "description",
              "seo_keywords",
              "facebook_instagram_hashtags",
              "linkedin_hashtags",
              "image_prompts"
          ]


          missing = [
              field
              for field in required_fields
              if not generated.get(field)
          ]


          if missing:

              raise RuntimeError(
                  f"Generated content is missing fields {missing}: "
                  f"{generated}"
              )


          image_prompts = generated["image_prompts"][:image_count]


          if len(image_prompts) < image_count:

              raise RuntimeError(
                  "The AI did not generate enough image prompts."
              )


          print("Content generated successfully.")
          print("Generating images...")


          output_dir = Path("generated_images")
          output_dir.mkdir(exist_ok=True)

          image_files = []


          for index, image_prompt in enumerate(
              image_prompts,
              start=1
          ):

              final_image_prompt = (
                  f"{image_prompt}. "
                  "Photorealistic, cinematic, visually powerful, "
                  "professional social-media photography, "
                  "vertical composition. "
                  "Absolutely no text, no words, no letters, "
                  "no typography, no logos and no watermarks."
              )


              image_payload = {
                  "prompt": final_image_prompt
              }


              print(
                  f"Generating image {index}/{image_count}..."
              )


              image_result = cloudflare_request(
                  "@cf/black-forest-labs/flux-1-schnell",
                  image_payload
              )


              image_base64 = image_result.get("image")


              if not image_base64:

                  raise RuntimeError(
                      f"No image returned for image {index}: "
                      f"{image_result}"
                  )


              image_path = (
                  output_dir / f"image_{index}.jpg"
              )


              with open(
                  image_path,
                  "wb"
              ) as image_file:

                  image_file.write(
                      base64.b64decode(image_base64)
                  )


              image_files.append(str(image_path))


          print("All images generated successfully.")


          fb_ig_hashtags = " ".join(
              generated["facebook_instagram_hashtags"]
          )


          linkedin_hashtags = " ".join(
              generated["linkedin_hashtags"]
          )


          instagram_facebook_text = (
              f"{generated['caption']}\n\n"
              f"{generated['description']}\n\n"
              f"{fb_ig_hashtags}"
          )


          linkedin_text = (
              f"{generated['caption']}\n\n"
              f"{generated['description']}\n\n"
              f"{linkedin_hashtags}"
          )


          final_output = {

              "caption": generated["caption"],

              "description": generated["description"],

              "seo_keywords": generated["seo_keywords"],

              "facebook_instagram_hashtags":
                  generated["facebook_instagram_hashtags"],

              "linkedin_hashtags":
                  generated["linkedin_hashtags"],

              "image_prompts": image_prompts,

              "instagram_facebook_text":
                  instagram_facebook_text,

              "linkedin_text":
                  linkedin_text,

              "image_files":
                  image_files
          }


          with open(
              "post_data.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  final_output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("========================================")
          print("SOCIAL MEDIA CONTENT GENERATED")
          print("========================================")
          print("")
          print("CAPTION:")
          print(generated["caption"])
          print("")
          print("DESCRIPTION:")
          print(generated["description"])
          print("")
          print("SEO KEYWORDS:")
          print(", ".join(generated["seo_keywords"]))
          print("")
          print("HASHTAGS:")
          print(fb_ig_hashtags)
          print("")
          print("IMAGES:")
          print(", ".join(image_files))
          print("")
          print("SUCCESS: CONTENT AND IMAGES ARE READY")
          PYTHON


      - name: Create public image URLs
        id: host_images
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          git config user.name "Fazl Ullah Azaad Automation"
          git config user.email "actions@github.com"

          git fetch origin media || true

          if git show-ref --verify --quiet refs/remotes/origin/media; then
            git checkout -B media origin/media
          else
            git checkout --orphan media
            git rm -rf . || true
          fi

          mkdir -p social-media-images

          DATE_FOLDER="$(date -u +%Y-%m-%d)"
          IMAGE_FOLDER="social-media-images/${DATE_FOLDER}/${RUN_ID}"

          mkdir -p "${IMAGE_FOLDER}"

          cp ../social-media-automation/generated_images/* \
             "${IMAGE_FOLDER}/"

          git add social-media-images

          git commit -m "Add generated social media images ${RUN_ID}" || true

          git push origin media

          cd ../social-media-automation

          python3 <<'PYTHON'
          import json
          import os
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]

          data = json.load(
              open(
                  "post_data.json",
                  encoding="utf-8"
              )
          )

          date_folder = __import__(
              "datetime"
          ).datetime.utcnow().strftime("%Y-%m-%d")

          public_urls = []

          for image_file in data["image_files"]:

              filename = Path(image_file).name

              url = (
                  f"https://raw.githubusercontent.com/"
                  f"{repository}/media/"
                  f"social-media-images/"
                  f"{date_folder}/"
                  f"{run_id}/"
                  f"{filename}"
              )

              public_urls.append(url)


          data["image_urls"] = public_urls


          with open(
              "post_data.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print("PUBLIC IMAGE URLS:")

          for url in public_urls:
              print(url)
          PYTHON


      - name: Publish posts to Buffer
        run: |
          python3 <<'PYTHON'
          import os
          import json
          import urllib.request
          import urllib.error

          buffer_token = os.environ["BUFFER_API_TOKEN"]

          channels = {
              "Facebook": os.environ["FACEBOOK_CHANNEL_ID"],
              "Instagram": os.environ["INSTAGRAM_CHANNEL_ID"],
              "LinkedIn": os.environ["LINKEDIN_CHANNEL_ID"]
          }


          with open(
              "post_data.json",
              encoding="utf-8"
          ) as file:

              post_data = json.load(file)


          image_urls = post_data["image_urls"]


          def create_buffer_post(
              channel_name,
              channel_id,
              text,
              is_instagram=False
          ):

              assets = [
                  {
                      "image": {
                          "url": image_url
                      }
                  }
                  for image_url in image_urls
              ]


              input_data = {
                  "text": text,
                  "channelId": channel_id,
                  "schedulingType": "automatic",
                  "mode": "addToQueue",
                  "assets": assets,
                  "aiAssisted": True
              }


              if is_instagram:

                  input_data["metadata"] = {
                      "instagram": {
                          "type": "post",
                          "shouldShareToFeed": True,
                          "isAiGenerated": True
                      }
                  }


              query = """
              mutation CreatePost($input: CreatePostInput!) {
                createPost(input: $input) {
                  ... on PostActionSuccess {
                    post {
                      id
                      text
                      dueAt
                      status
                      assets {
                        id
                        mimeType
                      }
                    }
                  }
                  ... on MutationError {
                    message
                  }
                }
              }
              """


              payload = {
                  "query": query,
                  "variables": {
                      "input": input_data
                  }
              }


              request = urllib.request.Request(
                  "https://api.buffer.com",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization":
                          f"Bearer {buffer_token}",

                      "Content-Type":
                          "application/json"
                  },
                  method="POST"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:

                      result = json.loads(
                          response.read().decode("utf-8")
                      )


              except urllib.error.HTTPError as error:

                  body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"{channel_name} Buffer HTTP "
                      f"error {error.code}: {body}"
                  )


              print("")
              print("=" * 60)
              print(f"BUFFER RESPONSE: {channel_name}")
              print("=" * 60)

              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  )
              )


              if result.get("errors"):

                  raise RuntimeError(
                      f"Buffer GraphQL error for "
                      f"{channel_name}: "
                      f"{result['errors']}"
                  )


              create_post = (
                  result
                  .get("data", {})
                  .get("createPost")
              )


              if not create_post:

                  raise RuntimeError(
                      f"No createPost response for "
                      f"{channel_name}: {result}"
                  )


              if create_post.get("message"):

                  raise RuntimeError(
                      f"Buffer rejected the "
                      f"{channel_name} post: "
                      f"{create_post['message']}"
                  )


              post = create_post.get("post")


              if not post:

                  raise RuntimeError(
                      f"Buffer did not return a "
                      f"created post for {channel_name}: "
                      f"{result}"
                  )


              print("")
              print(
                  f"SUCCESS: {channel_name} "
                  f"POST CREATED"
              )

              print(
                  f"POST ID: {post.get('id')}"
              )

              print(
                  f"DUE AT: {post.get('dueAt')}"
              )

              print(
                  f"STATUS: {post.get('status')}"
              )


          print("Publishing Facebook post...")

          create_buffer_post(
              "Facebook",
              channels["Facebook"],
              post_data["instagram_facebook_text"]
          )


          print("Publishing Instagram post...")

          create_buffer_post(
              "Instagram",
              channels["Instagram"],
              post_data["instagram_facebook_text"],
              is_instagram=True
          )


          print("Publishing LinkedIn post...")

          create_buffer_post(
              "LinkedIn",
              channels["LinkedIn"],
              post_data["linkedin_text"]
          )


          print("")
          print("=" * 60)
          print("ALL BUFFER POSTS WERE CREATED SUCCESSFULLY")
          print("=" * 60)
          PYTHON


      - name: Show final generated data
        if: always()
        run: |
          echo "========================================"
          echo "FINAL POST DATA"
          echo "========================================"
          cat post_data.json


      - name: Upload content and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-social-media-content
          path: |
            post_data.json
            generated_images/
          retention-days: 7

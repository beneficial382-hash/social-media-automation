name: Fazl Ullah Azaad - Daily Social Media Automation

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fazl-ullah-azaad-social-media
  cancel-in-progress: false

jobs:
  daily-social-media:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate daily content
        run: |
          python scripts/daily_social_media.py generate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./site"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish to Buffer
        run: |
          python scripts/daily_social_media.py publish

      - name: Finalize successful post
        run: |
          python scripts/daily_social_media.py finalize

      - name: Upload daily content artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-social-media-content
          path: |
            post_data.json
            content_history.json
          retention-days: 14

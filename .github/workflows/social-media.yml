name: Fazl Ullah Azaad - Daily Social Media Automation

on:
  schedule:
    # 08:00 AM Pakistan Standard Time = 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate social media content and image
        run: |
          python3 <<'PYTHON'
          import os
          import json
          import time
          import random
          import urllib.request
          import urllib.error
          import urllib.parse
          from pathlib import Path


          # ========================================
          # API KEYS
          # ========================================

          GEMINI_API_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          POLLINATIONS_API_KEY = os.environ.get(
              "POLLINATIONS_API_KEY",
              ""
          ).strip()


          if not GEMINI_API_KEY:
              raise RuntimeError(
                  "GEMINI_API_KEY is missing."
              )


          if not POLLINATIONS_API_KEY:
              raise RuntimeError(
                  "POLLINATIONS_API_KEY is missing."
              )


          # ========================================
          # SETTINGS
          # ========================================

          MAX_RETRIES = 6
          BASE_DELAY = 3
          TIMEOUT = 180


          # ========================================
          # GEMINI REQUEST
          # ========================================

          def gemini_request(
              model,
              payload
          ):

              url = (
                  "https://generativelanguage.googleapis.com/"
                  f"v1/models/{model}:generateContent"
              )


              retryable_codes = {
                  408,
                  429,
                  500,
                  502,
                  503,
                  504
              }


              last_error = None


              for attempt in range(
                  MAX_RETRIES
              ):

                  request = urllib.request.Request(
                      url,
                      data=json.dumps(
                          payload
                      ).encode("utf-8"),
                      headers={
                          "x-goog-api-key":
                              GEMINI_API_KEY,

                          "Content-Type":
                              "application/json"
                      },
                      method="POST"
                  )


                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=TIMEOUT
                      ) as response:

                          return json.loads(
                              response.read().decode(
                                  "utf-8"
                              )
                          )


                  except urllib.error.HTTPError as error:

                      body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )


                      last_error = (
                          f"HTTP {error.code}: {body}"
                      )


                      if (
                          error.code
                          not in retryable_codes
                      ):

                          raise RuntimeError(
                              "Gemini request failed: "
                              f"{last_error}"
                          )


                      if (
                          attempt
                          == MAX_RETRIES - 1
                      ):

                          break


                      delay = (
                          BASE_DELAY *
                          (2 ** attempt)
                      )

                      delay += random.uniform(
                          0,
                          2
                      )


                      print(
                          f"Gemini temporarily "
                          f"unavailable "
                          f"({error.code})."
                      )


                      print(
                          f"Retrying in "
                          f"{delay:.1f} seconds..."
                      )


                      time.sleep(delay)


                  except (
                      urllib.error.URLError,
                      TimeoutError
                  ) as error:


                      last_error = str(error)


                      if (
                          attempt
                          == MAX_RETRIES - 1
                      ):

                          break


                      delay = (
                          BASE_DELAY *
                          (2 ** attempt)
                      )


                      delay += random.uniform(
                          0,
                          2
                      )


                      print(
                          "Temporary network error."
                      )


                      print(
                          f"Retrying in "
                          f"{delay:.1f} seconds..."
                      )


                      time.sleep(delay)


              raise RuntimeError(
                  "Gemini failed after "
                  f"{MAX_RETRIES} attempts.\n"
                  f"Last error: {last_error}"
              )


          # ========================================
          # EXTRACT GEMINI TEXT
          # ========================================

          def extract_text(
              response
          ):

              candidates = response.get(
                  "candidates",
                  []
              )


              if not candidates:

                  raise RuntimeError(
                      "Gemini returned no candidates: "
                      f"{response}"
                  )


              parts = (
                  candidates[0]
                  .get("content", {})
                  .get("parts", [])
              )


              text_parts = []


              for part in parts:

                  if part.get("text"):

                      text_parts.append(
                          part["text"]
                      )


              if not text_parts:

                  raise RuntimeError(
                      "Gemini returned no text: "
                      f"{response}"
                  )


              return "\n".join(
                  text_parts
              )


          # ========================================
          # GENERATE CONTENT
          # ========================================

          print("")
          print(
              "========================================"
          )

          print(
              "GENERATING SOCIAL MEDIA CONTENT"
          )

          print(
              "========================================"
          )

          print("")


          prompt = """
          Create ONE completely original,
          powerful, realistic, intelligent
          and meaningful social-media post
          for the personal brand of
          Fazl Ullah Azaad.

          IMPORTANT:
          This is NOT content for AELAMA.

          Create content about real life.

          Possible themes include:

          - Personal growth
          - Discipline
          - Resilience
          - Self-respect
          - Consistency
          - Career growth
          - Learning
          - Leadership
          - Overcoming difficulties
          - Meaningful success
          - Human experiences

          REQUIREMENTS:

          - Completely original.
          - Do not invent quotations.
          - Do not attribute quotations
            to famous people.
          - Do not make unsupported
            factual claims.
          - Avoid generic motivational
            clichés.
          - Make the content realistic,
            emotionally intelligent and
            thought-provoking.
          - Suitable for Facebook,
            Instagram and LinkedIn.
          - Write a strong caption.
          - Write an engaging description.
          - Provide SEO keywords.
          - Provide natural Facebook and
            Instagram hashtags.
          - Provide professional LinkedIn
            hashtags.
          - Create ONE detailed image prompt.
          - The image must visually match
            the social-media post.
          - Image should be photorealistic,
            cinematic and powerful.
          - Vertical 9:16 composition.
          - Absolutely no text.
          - No words.
          - No letters.
          - No logos.
          - No watermarks.

          Return ONLY valid JSON.

          Use exactly this structure:

          {
            "caption": "string",

            "description": "string",

            "seo_keywords": [
              "keyword"
            ],

            "facebook_instagram_hashtags": [
              "#hashtag"
            ],

            "linkedin_hashtags": [
              "#hashtag"
            ],

            "image_prompt": "string"
          }
          """


          payload = {
              "contents": [
                  {
                      "role": "user",

                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],

              "generationConfig": {
                  "responseMimeType":
                      "application/json",

                  "temperature":
                      0.8,

                  "maxOutputTokens":
                      4000
              }
          }


          # IMPORTANT:
          # Change this only if your working
          # Gemini model has a different name.

          response = gemini_request(
              "gemini-3.8-flash",
              payload
          )


          print(
              "Gemini content response received."
          )


          raw_content = extract_text(
              response
          )


          try:

              generated = json.loads(
                  raw_content
              )


          except json.JSONDecodeError as error:

              raise RuntimeError(
                  "Gemini returned invalid JSON.\n\n"
                  f"{raw_content}\n\n"
                  f"Error: {error}"
              )


          required_fields = [
              "caption",
              "description",
              "seo_keywords",
              "facebook_instagram_hashtags",
              "linkedin_hashtags",
              "image_prompt"
          ]


          missing = [
              field
              for field in required_fields
              if not generated.get(field)
          ]


          if missing:

              raise RuntimeError(
                  "Generated content is missing: "
                  f"{missing}"
              )


          print(
              "Content generated successfully."
          )


          # ========================================
          # PREPARE FINAL POST TEXT
          # ========================================

          facebook_instagram_text = (
              f"{generated['caption']}\n\n"
              f"{generated['description']}\n\n"
              f"{' '.join(generated['facebook_instagram_hashtags'])}"
          )


          linkedin_text = (
              f"{generated['caption']}\n\n"
              f"{generated['description']}\n\n"
              f"{' '.join(generated['linkedin_hashtags'])}"
          )


          # ========================================
          # GENERATE IMAGE WITH POLLINATIONS
          # ========================================

          print("")

          print(
              "========================================"
          )

          print(
              "GENERATING IMAGE WITH POLLINATIONS"
          )

          print(
              "========================================"
          )

          print("")


          final_image_prompt = (
              generated["image_prompt"]
              + ". "
              + "Photorealistic, cinematic, "
              + "professional social media "
              + "photography, visually powerful, "
              + "vertical 9:16 composition. "
              + "Absolutely no text, no words, "
              + "no letters, no typography, "
              + "no logos and no watermarks."
          )


          encoded_prompt = urllib.parse.quote(
              final_image_prompt,
              safe=""
          )


          image_url = (
              "https://gen.pollinations.ai/image/"
              f"{encoded_prompt}"
              "?model=flux"
          )


          output_dir = Path(
              "generated_images"
          )

          output_dir.mkdir(
              exist_ok=True
          )


          image_path = (
              output_dir /
              "daily_image.jpg"
          )


          pollinations_request = (
              urllib.request.Request(
                  image_url,

                  headers={
                      "Authorization":
                          "Bearer "
                          + POLLINATIONS_API_KEY,

                      "User-Agent":
                          "Fazl-Ullah-Azaad-"
                          "Social-Media-Automation/1.0"
                  },

                  method="GET"
              )
          )


          last_error = None


          for attempt in range(
              MAX_RETRIES
          ):

              try:

                  print(
                      "Generating daily image..."
                  )


                  with urllib.request.urlopen(
                      pollinations_request,
                      timeout=TIMEOUT
                  ) as response:

                      image_data = response.read()


                  if not image_data:

                      raise RuntimeError(
                          "Pollinations returned "
                          "an empty image."
                      )


                  with open(
                      image_path,
                      "wb"
                  ) as file:

                      file.write(
                          image_data
                      )


                  print(
                      "Image generated successfully."
                  )


                  break


              except urllib.error.HTTPError as error:

                  body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )


                  last_error = (
                      f"HTTP {error.code}: {body}"
                  )


                  if (
                      attempt
                      == MAX_RETRIES - 1
                  ):

                      raise RuntimeError(
                          "Pollinations image generation "
                          "failed.\n"
                          f"Last error: {last_error}"
                      )


                  delay = (
                      BASE_DELAY *
                      (2 ** attempt)
                  )


                  delay += random.uniform(
                      0,
                      2
                  )


                  print(
                      "Pollinations temporarily "
                      "unavailable."
                  )


                  print(
                      f"Retrying in "
                      f"{delay:.1f} seconds..."
                  )


                  time.sleep(delay)


              except Exception as error:

                  last_error = str(error)


                  if (
                      attempt
                      == MAX_RETRIES - 1
                  ):

                      raise RuntimeError(
                          "Pollinations image generation "
                          "failed.\n"
                          f"Last error: {last_error}"
                      )


                  delay = (
                      BASE_DELAY *
                      (2 ** attempt)
                  )


                  print(
                      "Temporary image-generation "
                      "error."
                  )


                  print(
                      f"Retrying in "
                      f"{delay:.1f} seconds..."
                  )


                  time.sleep(delay)


          # ========================================
          # CREATE FINAL OUTPUT
          # ========================================

          final_output = {

              "brand":
                  "Fazl Ullah Azaad",

              "caption":
                  generated["caption"],

              "description":
                  generated["description"],

              "seo_keywords":
                  generated["seo_keywords"],

              "facebook_instagram_hashtags":
                  generated[
                      "facebook_instagram_hashtags"
                  ],

              "linkedin_hashtags":
                  generated[
                      "linkedin_hashtags"
                  ],

              "image_prompt":
                  generated[
                      "image_prompt"
                  ],

              "facebook_instagram_text":
                  facebook_instagram_text,

              "linkedin_text":
                  linkedin_text,

              "image_file":
                  str(image_path)
          }


          with open(
              "post_data.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  final_output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          # ========================================
          # SHOW RESULTS
          # ========================================

          print("")
          print(
              "========================================"
          )

          print(
              "SUCCESS - DAILY CONTENT READY"
          )

          print(
              "========================================"
          )

          print("")

          print("CAPTION:")
          print(
              generated["caption"]
          )

          print("")

          print("DESCRIPTION:")
          print(
              generated["description"]
          )

          print("")

          print("SEO KEYWORDS:")
          print(
              ", ".join(
                  generated["seo_keywords"]
              )
          )

          print("")

          print(
              "FACEBOOK / INSTAGRAM HASHTAGS:"
          )

          print(
              " ".join(
                  generated[
                      "facebook_instagram_hashtags"
                  ]
              )
          )

          print("")

          print(
              "LINKEDIN HASHTAGS:"
          )

          print(
              " ".join(
                  generated[
                      "linkedin_hashtags"
                  ]
              )
          )

          print("")

          print("IMAGE:")
          print(
              str(image_path)
          )

          print("")
          print(
              "POST, SEO AND IMAGE ARE READY."
          )

          PYTHON


      - name: Show generated post data
        run: |
          cat post_data.json


      - name: Upload post and image
        uses: actions/upload-artifact@v4
        with:
          name: daily-social-media-content
          path: |
            post_data.json
            generated_images/
          retention-days: 7

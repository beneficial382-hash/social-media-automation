name: Get Buffer Channel IDs

on:
  workflow_dispatch:

jobs:
  get-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Get Buffer Channels
        run: |
          curl -X POST https://api.buffer.com \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.BUFFER_API_KEY }}" \
            -d '{"query":"query GetOrganizations { account { organizations { id name } } }"}'

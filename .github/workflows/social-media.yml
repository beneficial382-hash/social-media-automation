name: AELAMA Daily Social Media Automation

on:
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Generate post, SEO and image prompt
        run: |
          curl --fail-with-body -sS \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/ai/run/@cf/zai-org/glm-4.7-flash" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "messages": [
                {
                  "role": "system",
                  "content": "You are the official AELAMA social media content strategist."
                },
                {
                  "role": "user",
                  "content": "Create one original, powerful, realistic and meaningful motivational social-media post about real life. Avoid fake quotes, clichés and unsupported claims. Return exactly these sections: CAPTION, DESCRIPTION, SEO_KEYWORDS, HASHTAGS, IMAGE_PROMPT. The IMAGE_PROMPT must describe a powerful, realistic, professional social-media image with no text or words inside the image."
                }
              ]
            }'

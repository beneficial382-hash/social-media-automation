name: Test Cloudflare AI

on:
  workflow_dispatch:

jobs:
  test-cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: Generate a motivational post
        run: |
          curl --fail-with-body -sS \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/ai/run/@cf/zai-org/glm-4.7-flash" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "messages": [
                {
                  "role": "user",
                  "content": "Create one short, original, realistic and powerful motivational post about real life. Include relevant SEO keywords and hashtags."
                }
              ]
            }'

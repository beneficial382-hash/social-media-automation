name: Fazl Ullah Azaad - Daily Social Media Automation

on:
  schedule:
    # 08:00 AM Pakistan Standard Time = 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      image_count:
        description: "Number of images to generate (1-4)"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}

      LINKEDIN_CHANNEL_ID: "6a9a260e065799be4684d272"
      INSTAGRAM_CHANNEL_ID: "6a9a25d6065799be4684d1d9"
      FACEBOOK_CHANNEL_ID: "6a9a21de065799be4684c649"

      IMAGE_COUNT: ${{ github.event.inputs.image_count || '1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate content and images
        id: generate
        run: |
          python3 <<'PYTHON'
          import os
          import json
          import base64
          import random
          import urllib.request
          import urllib.error
          from pathlib import Path

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          api_token = os.environ["CLOUDFLARE_API_TOKEN"]

          image_count = int(os.environ.get("IMAGE_COUNT", "1"))
          image_count = max(1, min(4, image_count))

          def cloudflare_request(model, payload):
              url = (
                  f"https://api.cloudflare.com/client/v4/accounts/"
                  f"{account_id}/ai/run/{model}"
              )

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_token}",
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      result = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"Cloudflare HTTP error {error.code}: {body}"
                  )

              if not result.get("success"):
                  raise RuntimeError(
                      f"Cloudflare request failed: {result}"
                  )

              return result.get("result", result)

          print("Generating original social media content...")

          schema = {
              "type": "object",
              "properties": {
                  "caption": {
                      "type": "string"
                  },
                  "description": {
                      "type": "string"
                  },
                  "seo_keywords": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },
                  "facebook_instagram_hashtags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },
                  "linkedin_hashtags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },
                  "image_prompts": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  }
              },
              "required": [
                  "caption",
                  "description",
                  "seo_keywords",
                  "facebook_instagram_hashtags",
                  "linkedin_hashtags",
                  "image_prompts"
              ]
          }

          prompt = f"""
          Create ONE original, powerful, realistic, intelligent and meaningful
          social-media post for the personal brand of Fazl Ullah Azaad.

          This is NOT content for AELAMA.

          The topic must relate to real life and may focus on:
          personal growth, resilience, discipline, consistency, self-respect,
          overcoming difficulties, career growth, learning, leadership,
          realistic success or meaningful human experiences.

          Requirements:
          - Completely original content.
          - Do not invent quotations.
          - Do not attribute quotes to famous people.
          - Do not make unsupported factual claims.
          - Avoid generic motivational clichés.
          - Make the writing realistic, emotionally intelligent and meaningful.
          - Suitable for Facebook, Instagram and LinkedIn.
          - Write a strong caption and an engaging description.
          - Provide relevant SEO keywords.
          - Provide natural hashtags specifically for Facebook/Instagram.
          - Provide professional hashtags specifically for LinkedIn.
          - Create exactly {image_count} different image prompts.
          - Each image prompt must visually match the post.
          - Images should be photorealistic, cinematic and professional.
          - No text, letters, typography, logos or watermarks in the images.
          - The images should be suitable for vertical social-media use.

          Return only the requested structured data.
          """

          content_payload = {
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are an expert personal-brand social-media "
                          "content strategist. Produce structured, original "
                          "and authentic content."
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "response_format": {
                  "type": "json_schema",
                  "json_schema": schema
              },
              "max_tokens": 2000
          }

          content_result = cloudflare_request(
              "@cf/meta/llama-3.3-70b-instruct-fp8-fast",
              content_payload
          )

          print("Cloudflare content response received.")

          # Cloudflare JSON Mode commonly returns the structured object
          # inside response/result depending on endpoint serialization.
          generated = (
              content_result.get("response")
              or content_result.get("output")
              or content_result.get("content")
              or content_result
          )

          if isinstance(generated, str):
              generated = json.loads(generated)

          if not isinstance(generated, dict):
              raise RuntimeError(
                  f"Could not parse generated content: {content_result}"
              )

          required_fields = [
              "caption",
              "description",
              "seo_keywords",
              "facebook_instagram_hashtags",
              "linkedin_hashtags",
              "image_prompts"
          ]

          missing = [
              field for field in required_fields
              if not generated.get(field)
          ]

          if missing:
              raise RuntimeError(
                  f"Generated content is missing fields {missing}: "
                  f"{generated}"
              )

          image_prompts = generated["image_prompts"][:image_count]

          if len(image_prompts) < image_count:
              raise RuntimeError(
                  "The AI did not generate enough image prompts."
              )

          print("Content generated successfully.")
          print("Generating images...")

          output_dir = Path("generated_images")
          output_dir.mkdir(exist_ok=True)

          image_files = []

          for index, image_prompt in enumerate(image_prompts, start=1):

              final_image_prompt = (
                  f"{image_prompt}. "
                  "Photorealistic, cinematic, visually powerful, "
                  "professional social-media photography, vertical composition. "
                  "Absolutely no text, no words, no letters, no typography, "
                  "no logos and no watermarks."
              )

              image_payload = {
                  "prompt": final_image_prompt,
                  "steps": 4,
                  "seed": random.randint(1, 2147483647)
              }

              print(f"Generating image {index}/{image_count}...")

              image_result = cloudflare_request(
                  "@cf/black-forest-labs/flux-1-schnell",
                  image_payload
              )

              image_base64 = image_result.get("image")

              if not image_base64:
                  raise RuntimeError(
                      f"No image returned for image {index}: "
                      f"{image_result}"
                  )

              image_path = output_dir / f"image_{index}.jpg"

              with open(image_path, "wb") as image_file:
                  image_file.write(
                      base64.b64decode(image_base64)
                  )

              image_files.append(str(image_path))

          seo_keywords = ", ".join(generated["seo_keywords"])

          fb_ig_hashtags = " ".join(
              generated["facebook_instagram_hashtags"]
          )

          linkedin_hashtags = " ".join(
              generated["linkedin_hashtags"]
          )

          instagram_facebook_text = (
              f"{generated['caption']}\n\n"
              f"{generated['description']}\n\n"
              f"{fb_ig_hashtags}"
          )

          linkedin_text = (
              f"{generated['caption']}\n\n"
              f"{generated['description']}\n\n"
              f"{linkedin_hashtags}"
          )

          final_output = {
              "caption": generated["caption"],
              "description": generated["description"],
              "seo_keywords": generated["seo_keywords"],
              "facebook_instagram_hashtags":
                  generated["facebook_instagram_hashtags"],
              "linkedin_hashtags": generated["linkedin_hashtags"],
              "image_prompts": image_prompts,
              "instagram_facebook_text": instagram_facebook_text,
              "linkedin_text": linkedin_text,
              "image_files": image_files
          }

          with open("post_data.json", "w", encoding="utf-8") as file:
              json.dump(
                  final_output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Content and images generated successfully.")
          PYTHON

      - name: Show generated post data
        run: |
          cat post_data.json

      - name: Upload generated files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-social-media-content
          path: |
            post_data.json
            generated_images/

      - name: Stop before publishing
        run: |
          echo "Content and images were generated successfully."
          echo "The publishing stage requires the exact current Buffer API"
          echo "request format and public image URLs."

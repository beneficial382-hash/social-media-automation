name: Generate Daily Motivational Post

on:
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Generate motivational content with Gemini
        run: |
          curl -s \
            -H "Content-Type: application/json" \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Create one original, powerful and realistic motivational and inspirational social-media post about real life. Avoid fake quotes, clichés and unsupported claims. Make it meaningful and relatable. Return: 1) a strong caption, 2) an engaging description, 3) relevant SEO keywords, and 4) appropriate hashtags for Facebook, Instagram and LinkedIn."
                }]
              }]
            }'

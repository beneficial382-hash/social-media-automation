name: Test OpenAI Astra API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-openai:
    runs-on: ubuntu-latest

    steps:
      - name: Call OpenAI GPT-6 Astra
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "ERROR: OPENAI_API_KEY is not configured."
            exit 1
          fi

          echo "Calling OpenAI GPT-6 Astra..."

          RESPONSE=$(curl --fail-with-body -sS \
            -X POST \
            "https://api.openai.com/v1/responses" \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-6-astra",
              "reasoning": {
                "effort": "low"
              },
              "input": "Write one short, original, realistic motivational message about real life. Return only the message."
            }')

          echo ""
          echo "========== OPENAI RESPONSE =========="
          echo "$RESPONSE"
          echo "====================================="

          echo "$RESPONSE" | python3 -c '
          import json
          import sys

          response = json.load(sys.stdin)

          if response.get("error"):
              print("OpenAI returned an error:")
              print(json.dumps(response["error"], indent=2))
              sys.exit(1)

          text = response.get("output_text")

          if not text:
              for item in response.get("output", []):
                  if item.get("type") == "message":
                      for part in item.get("content", []):
                          if part.get("type") == "output_text":
                              text = part.get("text")
                              break
                  if text:
                      break

          if not text:
              print("ERROR: No text was returned.")
              sys.exit(1)

          print("")
          print("========== GENERATED MESSAGE ==========")
          print(text)
          print("========================================")
          print("")
          print("SUCCESS: OpenAI GPT-6 Astra API is working.")
          '
